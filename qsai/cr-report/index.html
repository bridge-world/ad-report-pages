<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRレポート</title>
<style>
:root{--main:#2A6DB5;--sub:#4CAFD5;--accent:#E79C38}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#eaf1fa,#e8f6fb);color:#1f2a37;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
form{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(20,60,120,.12);border-top:5px solid var(--main)}
h1{font-size:17px;margin:0 0 4px;color:var(--main)}
p{font-size:12.5px;color:#6b7785;margin:0 0 18px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid #d5dde8;border-radius:8px;font-size:15px}
input[type=password]:focus{outline:2px solid var(--sub);border-color:transparent}
label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#6b7785;margin:10px 0 16px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--main);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#245d9b}
.err{color:#c0392b;font-size:12.5px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f">
  <h1>CRレポート</h1>
  <p>閲覧にはパスワードが必要です。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" autofocus required>
  <label><input id="rm" type="checkbox" checked> このブラウザに記憶する</label>
  <button type="submit">表示する</button>
  <div class="err" id="err"></div>
</form>
<script>
(function(){
const P = {"s": "2+YAQh/bz1UAZHfJpo1CTw==", "v": "Ynkd5J7otirUfw5c", "i": 300000, "c": "6JkjP/57yZV+P4zDODljpfYZhfoje2mDfEnnJWN/2hyHIgMxZlzNBOM4bZnPu8T8U4Lv1nC3ZZlnkeKa5tYwbEbRTIP5h16oGZ4H/XTozUbZFUljGM0sPy8mRYN7Ur37NJcULtU0av/eO10hyBe7SIu58MuWV53b77LgPncwdw+WU668Rpr4eY2nUZfS4ragKicVoiV8xqNSvcmVeoLY0LSxvgCuddTj/sa5ZPpP4MKCZe5vOUoF1oO6Uh585Q6djZGa0G6BeTOaneWi0OjfyjgRPyC30HSVfKFS5UnrjrQ2CXkhjtl6EJvvf/nvLD+EF6tB06fVg6e10sHdqAnCfuKMwj86z+g3+4KblblUFBwv82yoGd7JhZtpVCq5GfJXc84+iV/qgtfoPCvhPUCWAN6xJZBTbtNLynQIvJ6YwGqKXuWpWImXNa+0pPwNmVdLkrdoETTLRXA9ER8TCIkJz9mZ4VaLihHiVSz5dGUihd5tiRL2QqpWKB2OaiDzwi77xKcgYiipWbxxUc4dQH9O8K3DWgqgPULOhiNogdP5GpNaObO8KrFG3DI94iLOPDSEY1iKzwA7QH0xMK5qJFezmeIJ6rNzo/UZeyRCPbkyE21VeaseRLvHQQasi0lU4hdBNHcKD07bJpIpgJWR/IJnJKdkfox14nF8XTvluWAlgmtQ6vjdOHkXSfGDM86up/XMYx46kB+ZO/CkZdvLx8STarBAdjnfqke8xrsJhCanGwqHUSFJgA/O1JhiRxv6mPmOFKS0YM4kxG/+uJW8p9mfyzjF+qgnpRw9nOJgon9WtQCvVBmAG85tM60TV0465SxL/hZPjDsUcJRP5K3IyFO2gWZtxuCHPTCwlY+NVgfBmrFZbCGQdlS8eZoG0kmNnzsWJqjHPjgtwh4jMQqHzSJRdin/mEkXYMl1vqbFPLU/LodqHSXBaDWSH0AjFnPKwQDiKJ8I2mJp3rR2LB/iExMTfgEndgCmBDE+09SjXkhCIEJbPafoOso3ZoX9CMj4xh8PedP73SHGi8ERi742BS/iX0bhdmazUZj0yp2Sc8eyu5jFrKZUnJoUeRW3P8T6cIebPWsIN0iHB6q3YKkO6/E2B4KZaghcfMTadfV0f63dLw9qMRucmOioj13+IiHU17a3PlB336WN1IXcBtQWWOZD5sZdwoULYam+Go91eHq6e0BecjGXjf0h+hlrx2AuPeC+A+SdOyHdWu//+oidDsnfK2tf4Hpoa/ah"};
const KEY = 'cr-report-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
const ls = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}},
            set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};
const saved = ls.get();
if(saved) open(saved).catch(() => ls.del());
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  err.textContent = '';
  try{
    if(document.getElementById('rm').checked) ls.set(pw); else ls.del();
    await open(pw);
  }catch(ex){ ls.del(); err.textContent = 'パスワードが違います'; }
});
})();
</script>
</body></html>
