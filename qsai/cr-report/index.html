<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRレポート</title>
<style>
:root{--main:#2A6DB5;--sub:#4CAFD5;--accent:#E79C38}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#eaf1fa,#e8f6fb);color:#1f2a37;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
form{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(20,60,120,.12);border-top:5px solid var(--main)}
h1{font-size:17px;margin:0 0 4px;color:var(--main)}
p{font-size:12.5px;color:#6b7785;margin:0 0 18px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid #d5dde8;border-radius:8px;font-size:15px}
input[type=password]:focus{outline:2px solid var(--sub);border-color:transparent}
label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#6b7785;margin:10px 0 16px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--main);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#245d9b}
.err{color:#c0392b;font-size:12.5px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f">
  <h1>CRレポート</h1>
  <p>閲覧にはパスワードが必要です。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" autofocus required>
  <label><input id="rm" type="checkbox" checked> このブラウザに記憶する</label>
  <button type="submit">表示する</button>
  <div class="err" id="err"></div>
</form>
<script>

const P = {"s": "QXITHQ8OCdlGXFwhr2Y9Pg==", "v": "NcemNAQ3cMQCKoZa", "i": 300000, "c": "1EOFfwnoP/WRjZfhVIv/V5A7/Ma7zxsis1Jvpgbt3jzNWjSCbYMzB/pkgOQrGhpXxHWnOZKN+2/lCUUD7hsZ+6qXVKRYIXMDG+TfqmqbJfnMwZJfNh3ocZiwog6DpifEgf+NL9+rM/YM0q5d0vxIOVMi2b1e+Sy8lUaks0SuGF4a8cMM/EN4L088PSM+ST6gGX0LupW67Z90fknIFthFU3LbxEeFx4MxMJ0JmC2rQ456epBkSIrOEmjtf+KGv9xImhcDMe9JWjU6bvnSvFqywNTgbaFe3IBFRsgX+zF0iBhIeZnB7ULOsLb2ghIjRGh52iyvtv+3gcfA/BIzwcNsh43XmyYTXHjHqa92vLzGRSJkTuOqih49crfpQZ7hXx0PHgaHMdgr8jiWyiGKMLXN2HlBqEJVNZBj3+dKDUyXletFS/YvnYusn74FY0G3NPs//iqtml+qjLeZA9bPmzI1e5bPll45nvZ/6bUmRcEZhhprlYez40pdmI5xkJP70MXsXOG6B9Uk5QCGjyX6/QN5QeX1EIzAGjdMF078cU6IBCQoNIkgi2G8wVX7Iw/s6nnN8EGduurqxIKdXTWpvN8uvogbvRtFH6QUS7BpYiedDkUCW0jHac4ZJX9kTOVIpejtRVseiquQhoGb/n33UQH5XOzx1rtMwt3UQgxp5zV/WcrHcj51ADi3+L5aqSMsdrCnL6AXnnH3rR8DA2c2D79t9Gcm9CTCBvco+zrq8q1NrhIVOGh/My4/XGwlaJhubs6G0B24elTToQp07CUqEfP7CDNSS1rEyt2YSrTobuWA4EEheVquVU6qgg7BOPzz/kmdvYME4toFpsflND2kptrtOR7w0hknwfe/KZZfKu5t4Y4GXrtbNcu7snbGpocaeDYRRFBVrueFnmRcrr+1s3IlccMLv00Xzl1MsM6ZR+95oxGG52nH31AkiB6lOLxJCk+ZuoxNj/umkeRgzTSuwrdBOaPf07vC82XFswqz8o2KUiEpMwp3+k8hcyGT5u3iqNxN9gpVtA6SflMM+sOJGtsOnVOIu9koZb0zA2R3PDkT1PQlCbB2uBe7svQ5AisMxfKMZydjKWW+FWXXcyso/vphppPRAXI867UBwACGi+uycgENnItMfemVA/DAICzLzg+zjTFuWDOq03cY1a/qC9QOjrsKFu78j0KRls+XH93XwUlbeyWmI2aMAG4ocOH1h6FQwwIj5OkkZLTPmohdBIXvbnRLhNen0DcNTmIsoDND3Ws9pSOFt2gKYh9lA+SW+I/veSxPcGyejfGqDsK/UVsDkGTdUy4/q2Up3b2GH7nZPLzm21Tbc8Ytnzvl+g=="};
const KEY = 'cr-report-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
const ls = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}},
            set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};
const saved = ls.get();
if(saved) open(saved).catch(() => ls.del());
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  err.textContent = '';
  try{
    if(document.getElementById('rm').checked) ls.set(pw); else ls.del();
    await open(pw);
  }catch(ex){ ls.del(); err.textContent = 'パスワードが違います'; }
});
})();
</script>
