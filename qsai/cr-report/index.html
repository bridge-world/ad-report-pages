<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRレポート</title>
<style>
:root{--main:#2A6DB5;--sub:#4CAFD5;--accent:#E79C38}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#eaf1fa,#e8f6fb);color:#1f2a37;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
form{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(20,60,120,.12);border-top:5px solid var(--main)}
h1{font-size:17px;margin:0 0 4px;color:var(--main)}
p{font-size:12.5px;color:#6b7785;margin:0 0 18px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid #d5dde8;border-radius:8px;font-size:15px}
input[type=password]:focus{outline:2px solid var(--sub);border-color:transparent}
label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#6b7785;margin:10px 0 16px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--main);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#245d9b}
.err{color:#c0392b;font-size:12.5px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f">
  <h1>CRレポート</h1>
  <p>閲覧にはパスワードが必要です。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" autofocus required>
  <label><input id="rm" type="checkbox" checked> このブラウザに記憶する</label>
  <button type="submit">表示する</button>
  <div class="err" id="err"></div>
</form>
<script>
(function(){
const P = {"s": "QgFi18vpVXIii2g40+IRtQ==", "v": "Zh2uWk7X5Ysa2ROs", "i": 300000, "c": "13PP1IVC8y5lPy76vM6bxERQL8xOBZ17ck2DIDG8VyWkb9QVZS4kTH1PlwdhP4MAaMxt1qHjarD0FjFaAWsSWyZQTMiirQCKjfFQ7soisR4CdK0jKt0nyMHBo1iudLv5/G+0nhwVcdw+SYJdDrm8Plpriy1jbqqQjsSYt0ozRykRsslwGykSs0iT9hx4vavM+QFrNTrywzWHTMa7s31TePEXNaCgBVoDXVBp0O9wOGRO02W6X5aXcXxcEfjJGmFiHAAdpxsgd/k3b8vB50k277xqF6bg+5JdzF2qO6fGHs0EqfRnXY5HZPVZfCxCif11/XQQ+CW0jxzxARv7ufHqRMY0o4iTY0M14dndBW2PPt2YyRoRQoeqHSJi4Gha3Dy0Qyaa30YYyt/00L0xb54mPdtocBgmG9xVTSBA3mGPJymf5OMdof1ZFd75x3qbtK/tqpUkRO0WtB+DHihLFNCWULPAD1aC86WLe1LbHPfizBDaoHU6n1s6qa8ZaU/FPOcXUQlfXpvFkCNUYDWY5beLzUEeCobxoXB2HjAaWRIl6eUeQspXSgfiCxSZQRvliMqk3eiK0yJn3It1HrnWHLYrbq/awFd/Emvk+YOZw4O5OWbdg1ZR9K7cK6iY/u8fVcz5mSjoKLbN6j2SkUSVa9BDz1Fbtw7jMFzk9oN2EvLXcx+nAzSOOnlMYTgE+9bIIhT4QW7tuOIDlwBUqiB1HOn89BgHl3+l/b7Iqq28HKZrtW7B+TXyRum1s02YKAODy5qpjGOT7ebKyPxHak0yr2j48aOS6k4ZzgAEv8/vq4AlWsLae9J3ou6pbTp2E6X31E4ws6/f4MV1/LegOaaRnH4jusDPD5fgrkIY5g8L4suXioLHVwbRVC+DXVwUM+Xl3wWkH9Sv+4cUrfEsplQjtI2/FIblrUdfueayTv3Mv0aJ2DIentzOY2VxSBOltoHD/vd6V5IcwDTkXfM8SHuY4DwhwS6Z066g+xipk9TcS7I3k9fccyL7eRi174puMHfdBjzduyF2qyKYXa065X3RN6qxcW4QHkWYKCtfAATpfaMV5mnA6BC7SNjfpH43F0oIB5mYGqfmn/26S3g9/Ory+fIyKPQB25N22TAkYxRHMro/BJL/+8m5itR8RdtULuYXAjR5bhG0QRD9Omw5R/f4QfnSrubmpCiiGbo9nX0v2ogyqXcQ3xDGjkRzXqYgO5XFyN/kBrMeOGl9VpDSQF5/4pEjNC8CSXKN39Th"};
const KEY = 'cr-report-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
const ls = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}},
            set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};
const saved = ls.get();
if(saved) open(saved).catch(() => ls.del());
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  err.textContent = '';
  try{
    if(document.getElementById('rm').checked) ls.set(pw); else ls.del();
    await open(pw);
  }catch(ex){ ls.del(); err.textContent = 'パスワードが違います'; }
});
})();
</script>
</body></html>
